{
  "schema_version": 1,
  "skill_version": "0.1.0",
  "profile": "skill-repository",
  "project": "skills",
  "authority": {
    "project_entry": "README.md",
    "agent_instructions": "AGENTS.md",
    "documentation_standard": "docs/AGENTS.md",
    "architecture": "docs/architecture.md",
    "backlog": "docs/backlog.md",
    "agent_notes": ".agents/notes/README.md"
  },
  "tiers": {
    "current": [
      "README.md",
      "AGENTS.md",
      "CONTEXT.md",
      "docs/AGENTS.md",
      "docs/architecture.md",
      "docs/backlog.md",
      "docs/subsystems/**",
      "docs/runbooks/**",
      "docs/reference/**"
    ],
    "historical": [
      "docs/superpowers/**",
      "docs/releases/**",
      "docs/postmortems/**",
      "docs/postmortem/**",
      ".agents/notes/archived/**"
    ]
  },
  "exclude": [
    ".git/**",
    ".venv/**",
    "node_modules/**",
    "**/__pycache__/**",
    "tests/fixtures/**",
    "dist/**"
  ],
  "agent_notes": {
    "root": ".agents/notes",
    "statuses": {
      "proposed": "proposed",
      "implemented": "implemented",
      "rejected": "rejected",
      "archived": "implemented"
    }
  },
  "budgets": {
    "AGENTS.md": {
      "metric": "unicode_chars",
      "max": 5000
    },
    "README.md": {
      "metric": "unicode_chars",
      "max": 10000
    },
    "docs/AGENTS.md": {
      "metric": "unicode_chars",
      "max": 7000
    },
    "docs/architecture.md": {
      "metric": "unicode_chars",
      "max": 8000
    }
  },
  "impact_mappings": [
    {
      "name": "skill-interface",
      "code": [
        "*/SKILL.md",
        "*/agents/**"
      ],
      "docs": [
        "README.md",
        "docs/reference/skill-contract.md"
      ],
      "level": "hard"
    },
    {
      "name": "governance-cli-and-assets",
      "code": [
        "dsh-doc-audits/scripts/**",
        "dsh-doc-audits/assets/**"
      ],
      "docs": [
        "docs/subsystems/governance-cli.md",
        "docs/reference/skill-contract.md"
      ],
      "level": "hard"
    },
    {
      "name": "governance-method",
      "code": [
        "dsh-doc-audits/references/**"
      ],
      "docs": [
        "docs/architecture.md",
        "docs/AGENTS.md"
      ],
      "level": "soft"
    },
    {
      "name": "release-and-ci",
      "code": [
        ".github/workflows/**",
        "scripts/verify.sh",
        "pyproject.toml",
        "Makefile"
      ],
      "docs": [
        "docs/runbooks/release.md"
      ],
      "level": "hard"
    }
  ],
  "audit": {
    "duplicate_min_chars": 180,
    "historical_authority_terms": [
      "current authority",
      "source of truth",
      "唯一权威",
      "权威文档"
    ]
  }
}
