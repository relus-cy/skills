name: docs-governance

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify documentation governance
        run: python scripts/verify_docs.py --repo . --completion --json
      - name: Verify documentation impact
        if: github.event_name == 'pull_request'
        run: python scripts/verify_docs.py --repo . --base "${{ github.event.pull_request.base.sha }}" --json
